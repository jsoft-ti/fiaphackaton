# Requires the metrics-server addon to be running in the cluster (see
# README "Como escalar os microsserviços").
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: campaignuserservice
  namespace: campaign-system
  labels:
    app.kubernetes.io/name: campaignuserservice
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: campaign-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: campaignuserservice
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
