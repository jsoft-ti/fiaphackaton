# Local-dev placeholder credentials. CHANGE THESE before using this manifest
# anywhere beyond a local Minikube/Kind/Docker-Desktop cluster.
#
# `stringData` is used instead of pre-encoded `data` purely for readability -
# Kubernetes base64-encodes these into the underlying Secret automatically
# on apply; from that point on they are stored/transmitted exactly like any
# other Secret.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: campaign-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: campaign-system
type: Opaque
stringData:
  POSTGRES_USER: campaignuser
  POSTGRES_PASSWORD: CHANGE_ME_postgres_password
