# Dedicated ServiceAccount shared by both DonationService processes (Api and
# Worker - see worker-deployment.yaml for why the Worker exists as a second
# Deployment). Neither calls the Kubernetes API, so no Roles/RoleBindings
# are granted and token automounting is disabled.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: donationservice
  namespace: campaign-system
  labels:
    app.kubernetes.io/name: donationservice
    app.kubernetes.io/part-of: campaign-system
automountServiceAccountToken: false
