# Not part of the literal folder tree given in the spec, but required for a
# functional deployment: neither CampaignUserService nor DonationService has
# real EF Core migrations yet (Database:AutoMigrateAndSeed's MigrateAsync()
# call is a safe no-op with zero migrations - see README "Desvios do
# template solicitado"), so both schemas must be provisioned another way.
# The official postgres image runs every *.sql file under
# /docker-entrypoint-initdb.d/ automatically, in filename order, exactly
# once, the first time it starts against an empty PGDATA directory.
#
# The infra spec lists only ONE PostgreSQL instance ("do CampaignUserService"),
# so DonationService's own tables (donations, donation_histories,
# donation_events, plus MassTransit's outbox tables) are provisioned in the
# SAME physical database, isolated in their own "donation_service" schema
# (already DonationDbContext's default schema in code - no code change
# needed) alongside CampaignUserService's "campaign_user" schema.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: campaign-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: campaign-system
data:
  01-campaignuserservice-schema.sql: |
    -- =============================================================================
    -- CampaignUserService - manual bootstrap script for Supabase PostgreSQL
    --
    -- This script is an EXACT mirror of the EF Core model (see
    -- src/CampaignUserService.Infrastructure/Persistence/Configurations/*.cs).
    -- It exists as a fast, dependency-free way to provision the schema directly
    -- from the Supabase SQL Editor, without needing the .NET SDK installed.
    --
    -- The normal/preferred path is still EF Core migrations:
    --   dotnet ef migrations add InitialCreate \
    --     --project src/CampaignUserService.Infrastructure \
    --     --startup-project src/CampaignUserService.Api
    --   dotnet ef database update \
    --     --project src/CampaignUserService.Infrastructure \
    --     --startup-project src/CampaignUserService.Api
    --
    -- Running THIS script instead is equivalent for a fresh database and lets
    -- the API start immediately (set Database:AutoMigrateAndSeed=false in that
    -- case, since there won't be an EF migrations history to apply).
    -- =============================================================================

    CREATE SCHEMA IF NOT EXISTS campaign_user;

    -- gen_random_uuid() lives in pgcrypto; enabled by default on Supabase, but
    -- declared here explicitly so the script is self-contained on any Postgres.
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    -- ----------------------------------------------------------------------------
    -- roles
    -- ----------------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS campaign_user.roles (
        id              uuid PRIMARY KEY,
        name            varchar(30)   NOT NULL,
        description     varchar(500)  NOT NULL,
        created_at_utc  timestamptz   NOT NULL DEFAULT now(),
        updated_at_utc  timestamptz   NULL,
        deleted_at_utc  timestamptz   NULL,
        is_deleted      boolean       NOT NULL DEFAULT false
    );

    CREATE UNIQUE INDEX IF NOT EXISTS ix_roles_name ON campaign_user.roles (name);

    -- ----------------------------------------------------------------------------
    -- users
    -- ----------------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS campaign_user.users (
        id                   uuid PRIMARY KEY,
        first_name           varchar(100)  NOT NULL,
        last_name            varchar(100)  NOT NULL,
        email                varchar(256)  NOT NULL,
        password_hash        varchar(500)  NOT NULL,
        phone_number         varchar(20)   NULL,
        cpf                  varchar(11)   NULL,
        photo_url            varchar(2048) NULL,
        birth_date           date          NULL,
        status               varchar(20)   NOT NULL,
        email_confirmed      boolean       NOT NULL DEFAULT false,
        last_login_at_utc    timestamptz   NULL,
        access_failed_count  integer       NOT NULL DEFAULT 0,
        created_at_utc       timestamptz   NOT NULL DEFAULT now(),
        updated_at_utc       timestamptz   NULL,
        deleted_at_utc       timestamptz   NULL,
        is_deleted           boolean       NOT NULL DEFAULT false
    );

    CREATE UNIQUE INDEX IF NOT EXISTS ix_users_email ON campaign_user.users (email);
    CREATE UNIQUE INDEX IF NOT EXISTS ix_users_cpf ON campaign_user.users (cpf) WHERE cpf IS NOT NULL;

    -- ----------------------------------------------------------------------------
    -- user_roles
    -- ----------------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS campaign_user.user_roles (
        id              uuid PRIMARY KEY,
        user_id         uuid NOT NULL REFERENCES campaign_user.users (id) ON DELETE CASCADE,
        role_id         uuid NOT NULL REFERENCES campaign_user.roles (id) ON DELETE RESTRICT,
        created_at_utc  timestamptz NOT NULL DEFAULT now(),
        updated_at_utc  timestamptz NULL,
        deleted_at_utc  timestamptz NULL,
        is_deleted      boolean NOT NULL DEFAULT false
    );

    CREATE UNIQUE INDEX IF NOT EXISTS ix_user_roles_user_role ON campaign_user.user_roles (user_id, role_id);

    -- ----------------------------------------------------------------------------
    -- refresh_tokens
    -- ----------------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS campaign_user.refresh_tokens (
        id                       uuid PRIMARY KEY,
        user_id                  uuid NOT NULL REFERENCES campaign_user.users (id) ON DELETE CASCADE,
        token_hash               varchar(500) NOT NULL,
        expires_at_utc           timestamptz NOT NULL,
        revoked_at_utc           timestamptz NULL,
        revoked_by_ip            varchar(64) NULL,
        replaced_by_token_hash   varchar(500) NULL,
        created_by_ip            varchar(64) NOT NULL,
        user_agent               varchar(512) NULL,
        created_at_utc           timestamptz NOT NULL DEFAULT now(),
        updated_at_utc           timestamptz NULL,
        deleted_at_utc           timestamptz NULL,
        is_deleted               boolean NOT NULL DEFAULT false
    );

    CREATE UNIQUE INDEX IF NOT EXISTS ix_refresh_tokens_token_hash ON campaign_user.refresh_tokens (token_hash);
    CREATE INDEX IF NOT EXISTS ix_refresh_tokens_user_id ON campaign_user.refresh_tokens (user_id);

    -- ----------------------------------------------------------------------------
    -- password_reset_tokens
    -- ----------------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS campaign_user.password_reset_tokens (
        id              uuid PRIMARY KEY,
        user_id         uuid NOT NULL REFERENCES campaign_user.users (id) ON DELETE CASCADE,
        token_hash      varchar(500) NOT NULL,
        expires_at_utc  timestamptz NOT NULL,
        used_at_utc     timestamptz NULL,
        created_at_utc  timestamptz NOT NULL DEFAULT now(),
        updated_at_utc  timestamptz NULL,
        deleted_at_utc  timestamptz NULL,
        is_deleted      boolean NOT NULL DEFAULT false
    );

    CREATE UNIQUE INDEX IF NOT EXISTS ix_password_reset_tokens_token_hash ON campaign_user.password_reset_tokens (token_hash);
    CREATE INDEX IF NOT EXISTS ix_password_reset_tokens_user_id ON campaign_user.password_reset_tokens (user_id);

    -- ----------------------------------------------------------------------------
    -- audit_logs
    -- ----------------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS campaign_user.audit_logs (
        id               uuid PRIMARY KEY,
        user_id          uuid NULL REFERENCES campaign_user.users (id) ON DELETE SET NULL,
        action           varchar(50) NOT NULL,
        description      varchar(1000) NOT NULL,
        ip_address       varchar(64) NULL,
        user_agent       varchar(512) NULL,
        occurred_at_utc  timestamptz NOT NULL,
        created_at_utc   timestamptz NOT NULL DEFAULT now(),
        updated_at_utc   timestamptz NULL,
        deleted_at_utc   timestamptz NULL,
        is_deleted       boolean NOT NULL DEFAULT false
    );

    CREATE INDEX IF NOT EXISTS ix_audit_logs_user_id ON campaign_user.audit_logs (user_id);
    CREATE INDEX IF NOT EXISTS ix_audit_logs_occurred_at_utc ON campaign_user.audit_logs (occurred_at_utc);

    -- ----------------------------------------------------------------------------
    -- EF Core migrations history table: deliberately NOT created here.
    --
    -- EF Core's HistoryRepository always uses columns named "MigrationId" and
    -- "ProductVersion" (PascalCase, case-sensitive/quoted) - hand-writing this
    -- table with any other column naming (e.g. snake_case, to match the rest
    -- of this script) causes MigrateAsync() to fail at startup with
    -- 'column "MigrationId" does not exist'. Since there are no real EF Core
    -- migrations in this codebase yet, MigrateAsync() first checks whether the
    -- history table exists at all and safely no-ops if it doesn't - so simply
    -- omitting it here is both correct and the path of least surprise.
    -- ----------------------------------------------------------------------------

    -- ----------------------------------------------------------------------------
    -- Seed: the two system roles. Idempotent (safe to re-run).
    -- ----------------------------------------------------------------------------
    INSERT INTO campaign_user.roles (id, name, description, created_at_utc)
    SELECT gen_random_uuid(), 'Doador', 'Doador: pode se cadastrar, autenticar e gerenciar o próprio perfil.', now()
    WHERE NOT EXISTS (SELECT 1 FROM campaign_user.roles WHERE name = 'Doador');

    INSERT INTO campaign_user.roles (id, name, description, created_at_utc)
    SELECT gen_random_uuid(), 'GestorOng', 'GestorOng: administra usuários, roles e campanhas da organização.', now()
    WHERE NOT EXISTS (SELECT 1 FROM campaign_user.roles WHERE name = 'GestorOng');

    -- The initial GestorOng administrator account is intentionally NOT created
    -- here (it requires a BCrypt password hash, which must be generated by the
    -- application). It is created automatically on first API startup from the
    -- AdminSeed:Email / AdminSeed:Password configuration.
  02-donationservice-schema.sql: |
    -- DonationService PostgreSQL bootstrap script.
    --
    -- Hand-written to mirror exactly what EF Core's model configuration
    -- (DonationDbContext + Configurations/*.cs) describes, since no `dotnet ef`
    -- SDK was available to generate migrations in this environment.
    --
    -- Tables:
    --   donation_service.donations            - write-side donation request record
    --   donation_service.donation_histories   - append-only status-transition audit trail
    --   donation_service.donation_events      - business-level log of raised integration events
    --   donation_service.inbox_state / outbox_message / outbox_state
    --                                          - MassTransit's own Entity Framework Bus Outbox tables
    --
    -- All donation *documents* used for reads live in MongoDB - this schema
    -- covers only what DonationService itself owns transactionally in Postgres.
    -- Deployed into the SAME physical database as CampaignUserService (this
    -- infra spec provisions only one PostgreSQL instance), isolated in its
    -- own schema.

    CREATE SCHEMA IF NOT EXISTS donation_service;

    CREATE TABLE IF NOT EXISTS donation_service.donations (
        id               uuid            NOT NULL PRIMARY KEY,
        campaign_id      uuid            NOT NULL,
        user_id          uuid            NOT NULL,
        user_name        varchar(200)    NOT NULL,
        user_email       varchar(320)    NOT NULL,
        value            numeric(18,2)   NOT NULL,
        currency         varchar(10)     NOT NULL,
        payment_method   varchar(20)     NOT NULL,
        donation_date    timestamptz     NOT NULL,
        status           varchar(20)     NOT NULL,
        correlation_id   uuid            NOT NULL,
        event_id         uuid            NOT NULL,
        created_at_utc   timestamptz     NOT NULL DEFAULT now(),
        updated_at_utc   timestamptz     NULL
    );

    CREATE INDEX IF NOT EXISTS ix_donations_campaign_id ON donation_service.donations (campaign_id);
    CREATE INDEX IF NOT EXISTS ix_donations_user_id ON donation_service.donations (user_id);
    CREATE UNIQUE INDEX IF NOT EXISTS ux_donations_event_id ON donation_service.donations (event_id);
    CREATE INDEX IF NOT EXISTS ix_donations_correlation_id ON donation_service.donations (correlation_id);

    CREATE TABLE IF NOT EXISTS donation_service.donation_histories (
        id               uuid            NOT NULL PRIMARY KEY,
        donation_id      uuid            NOT NULL REFERENCES donation_service.donations (id) ON DELETE CASCADE,
        previous_status  varchar(20)     NOT NULL,
        new_status       varchar(20)     NOT NULL,
        description      varchar(500)    NOT NULL,
        occurred_at_utc  timestamptz     NOT NULL,
        created_at_utc   timestamptz     NOT NULL DEFAULT now(),
        updated_at_utc   timestamptz     NULL
    );

    CREATE INDEX IF NOT EXISTS ix_donation_histories_donation_id ON donation_service.donation_histories (donation_id);

    CREATE TABLE IF NOT EXISTS donation_service.donation_events (
        id               uuid            NOT NULL PRIMARY KEY,
        donation_id      uuid            NOT NULL REFERENCES donation_service.donations (id) ON DELETE CASCADE,
        event_id         uuid            NOT NULL,
        correlation_id   uuid            NOT NULL,
        event_type       varchar(300)    NOT NULL,
        payload_json     jsonb           NOT NULL,
        occurred_at_utc  timestamptz     NOT NULL,
        created_at_utc   timestamptz     NOT NULL DEFAULT now(),
        updated_at_utc   timestamptz     NULL
    );

    CREATE UNIQUE INDEX IF NOT EXISTS ux_donation_events_event_id ON donation_service.donation_events (event_id);
    CREATE INDEX IF NOT EXISTS ix_donation_events_donation_id ON donation_service.donation_events (donation_id);

    -- MassTransit Entity Framework Bus Outbox tables (AddInboxStateEntity /
    -- AddOutboxMessageEntity / AddOutboxStateEntity). Column names/types below
    -- follow MassTransit 8.x's default EF Core mapping.

    CREATE TABLE IF NOT EXISTS donation_service.inbox_state (
        id                  bigserial       NOT NULL PRIMARY KEY,
        message_id          uuid            NOT NULL,
        consumer_id         uuid            NOT NULL,
        lock_id             uuid            NOT NULL,
        row_version         bytea           NULL,
        received             timestamptz    NOT NULL,
        receive_count       integer         NOT NULL,
        expiration_time     timestamptz     NULL,
        consumed             timestamptz    NULL,
        delivered            timestamptz    NULL,
        last_sequence_number bigint         NULL,
        CONSTRAINT ux_inbox_state_message_consumer UNIQUE (message_id, consumer_id)
    );

    CREATE TABLE IF NOT EXISTS donation_service.outbox_message (
        sequence_number       bigserial     NOT NULL PRIMARY KEY,
        enqueue_time          timestamptz   NULL,
        sent_time             timestamptz   NOT NULL,
        headers               text          NULL,
        properties             text         NULL,
        inbox_message_id       uuid         NULL,
        inbox_consumer_id       uuid        NULL,
        outbox_id               uuid        NULL,
        message_id              uuid        NOT NULL,
        content_type             varchar(256) NOT NULL,
        message_type              text      NOT NULL,
        body                       text     NOT NULL,
        conversation_id             uuid    NULL,
        correlation_id               uuid   NULL,
        initiator_id                  uuid  NULL,
        request_id                     uuid NULL,
        source_address                  varchar(256) NULL,
        destination_address              varchar(256) NULL,
        response_address                  varchar(256) NULL,
        fault_address                      varchar(256) NULL,
        expiration_time                     timestamptz NULL
    );

    CREATE INDEX IF NOT EXISTS ix_outbox_message_inbox ON donation_service.outbox_message (inbox_message_id, inbox_consumer_id, sequence_number);
    CREATE INDEX IF NOT EXISTS ix_outbox_message_outbox ON donation_service.outbox_message (outbox_id, sequence_number);

    CREATE TABLE IF NOT EXISTS donation_service.outbox_state (
        outbox_id            uuid          NOT NULL PRIMARY KEY,
        lock_id               uuid         NOT NULL,
        row_version            bytea       NULL,
        created                 timestamptz NOT NULL,
        delivered                timestamptz NULL,
        last_sequence_number       bigint  NULL
    );

    -- Convenience view for GestorOng-facing tooling/BI, exposing the write-side
    -- audit trail without needing direct table access.
    CREATE OR REPLACE VIEW donation_service.v_donation_audit_trail AS
    SELECT
        d.id              AS donation_id,
        d.campaign_id,
        d.user_id,
        d.user_name,
        d.value,
        d.currency,
        d.status,
        h.previous_status,
        h.new_status,
        h.description,
        h.occurred_at_utc
    FROM donation_service.donations d
    JOIN donation_service.donation_histories h ON h.donation_id = d.id
    ORDER BY d.id, h.occurred_at_utc;
