# Not part of the literal 4-file secrets/ list in the spec (postgres,
# mongodb, rabbitmq, jwt), but CampaignUserService seeds an initial
# GestorOng administrator account on first boot (AdminSeed:Email /
# AdminSeed:Password) and that password is a genuine credential that must
# not live in a ConfigMap or be hard-coded in the Deployment. See
# README.md "Desvios do template solicitado".
apiVersion: v1
kind: Secret
metadata:
  name: campaignuserservice-secret
  namespace: campaign-system
  labels:
    app.kubernetes.io/name: campaignuserservice
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: campaign-system
type: Opaque
stringData:
  ADMIN_EMAIL: admin@campanhas-sociais.org
  ADMIN_PASSWORD: CHANGE_ME_admin_password_123!
