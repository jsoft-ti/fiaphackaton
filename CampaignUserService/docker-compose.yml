services:
  campaign-user-db:
    image: postgres:16-alpine
    container_name: campaign-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campaign_user_service}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - campaign_user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-campaign_user_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campaign-user-network

  campaign-user-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campaign-user-api
    restart: unless-stopped
    depends_on:
      campaign-user-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: >-
        Host=campaign-user-db;Port=5432;Database=${POSTGRES_DB:-campaign_user_service};
        Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-CampaignUserService}
      Jwt__Audience: ${JWT_AUDIENCE:-CampaignUserService.Clients}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      AdminSeed__FirstName: ${ADMIN_FIRST_NAME:-Admin}
      AdminSeed__LastName: ${ADMIN_LAST_NAME:-Master}
      AdminSeed__Email: ${ADMIN_EMAIL}
      AdminSeed__Password: ${ADMIN_PASSWORD}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@campanhas-sociais.org}
      Smtp__FromName: ${SMTP_FROM_NAME:-Campanhas Sociais}
      Smtp__Enabled: ${SMTP_ENABLED:-false}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-http://localhost:3000}
      Database__AutoMigrateAndSeed: ${DATABASE_AUTO_MIGRATE_AND_SEED:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - campaign_user_api_logs:/app/logs
    networks:
      - campaign-user-network

networks:
  campaign-user-network:
    driver: bridge

volumes:
  campaign_user_db_data:
  campaign_user_api_logs:
