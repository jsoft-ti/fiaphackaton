# Shared JWT signing key. CampaignUserService ISSUES tokens signed with this
# key (config path Jwt:Secret); DonationService only VALIDATES tokens using
# the exact same key (config path Jwt:SecretKey) - it never issues or
# refreshes tokens itself. Both services MUST reference this one Secret so
# the value can never drift between them.
#
# CHANGE THIS before using this manifest anywhere beyond a local cluster.
# Generate a strong value with: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: campaign-system
  labels:
    app.kubernetes.io/part-of: campaign-system
type: Opaque
stringData:
  JWT_SECRET: fuvxRhfBkibgI6EAPEs53Vzhc4kGLwGocvUSJ5LIWc8SkdVM038FrXaD07jeBcTw
