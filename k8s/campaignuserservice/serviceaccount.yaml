# Dedicated ServiceAccount (least privilege): no Roles/RoleBindings are
# granted to it - CampaignUserService never calls the Kubernetes API, so it
# gets zero permissions, and automountServiceAccountToken is disabled below
# and on the Deployment's Pod spec so a token isn't even mounted into the
# container filesystem.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: campaignuserservice
  namespace: campaign-system
  labels:
    app.kubernetes.io/name: campaignuserservice
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: campaign-system
automountServiceAccountToken: false
