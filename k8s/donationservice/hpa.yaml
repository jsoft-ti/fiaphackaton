# Requires the metrics-server addon to be running in the cluster (see
# README "Como escalar os microsserviços"). Two HorizontalPodAutoscalers -
# one per DonationService process - since the Api (request-driven) and the
# Worker (queue-consumption-driven) scale for different reasons.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: donationservice-api
  namespace: campaign-system
  labels:
    app.kubernetes.io/name: donationservice-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: campaign-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: donationservice-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: donationservice-worker
  namespace: campaign-system
  labels:
    app.kubernetes.io/name: donationservice-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: campaign-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: donationservice-worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
